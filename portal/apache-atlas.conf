SetEnv CI_ENV production
PassEnv ATLAS_API_URL ATLAS_API_KEY ATLAS_API_TIMEOUT PORTAL_BASE_URL PORTAL_DB_HOST PORTAL_DB_NAME PORTAL_DB_USER PORTAL_DB_PASSWORD

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
